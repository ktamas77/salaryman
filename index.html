<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salaryman</title>
<style>
  :root { --bg:#fafafa; --fg:#111; --muted:#666; --card:#fff; --line:#e5e5e5; --accent:#0a7d3e; --neg:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1b1b1b; --line:#2c2c2c; --accent:#3ddc84; --neg:#ff6b6b; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0 0 4px } p.sub { color:var(--muted); margin:0 0 20px }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px }
  input, select { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  input { flex:1; min-width:200px; font-size:20px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; overflow-x:auto }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums }
  td, th { padding:6px 8px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap }
  td:first-child, th:first-child { text-align:left }
  tr.neg td:not(:first-child) { color:var(--neg) }
  tr.total td { font-weight:700; color:var(--accent); border-bottom:none }
  small { color:var(--muted) }
</style>
</head>
<body>
<main>
  <h1>Salaryman</h1>
  <p class="sub">California W-2 take-home, tax year 2026</p>

  <div class="row">
    <input id="salary" value="$180,000" inputmode="numeric" aria-label="Annual salary">
    <select id="status" aria-label="Filing status">
      <option value="single">Single</option>
      <option value="mfj">Married filing jointly</option>
    </select>
  </div>
  <div class="row">
    <input id="housing" placeholder="Monthly rent / mortgage, e.g. $3,000" inputmode="numeric" aria-label="Monthly housing cost">
  </div>

  <div class="card"><table id="breakdown"></table></div>
  <div class="card"><table id="pay"></table></div>
  <div class="card" id="housingCard" hidden><table id="afterHousing"></table></div>
  <small id="rates">Loading exchange rates…</small>
  <p><small>Estimate only. Standard deduction, no pre-tax 401k/HSA/benefits, no credits. Federal 2026 brackets (OBBBA-indexed); CA brackets use 2025 indexed values; CA SDI 1.3% uncapped. Semi-monthly = annual ÷ 24.</small></p>
</main>

<script>
const T = {
  single: {
    fedStd: 16100,
    fed: [[12400,.10],[50400,.12],[105700,.22],[201775,.24],[256225,.32],[640600,.35],[Infinity,.37]],
    caStd: 5706, caCredit: 153,
    ca: [[11079,.01],[26264,.02],[41452,.04],[57542,.06],[72724,.08],[371479,.093],[445771,.103],[742953,.113],[Infinity,.123]],
    addlMedicare: 200000,
  },
  mfj: {
    fedStd: 32200,
    fed: [[24800,.10],[100800,.12],[211400,.22],[403550,.24],[512450,.32],[768700,.35],[Infinity,.37]],
    caStd: 11412, caCredit: 306,
    ca: [[22158,.01],[52528,.02],[82904,.04],[115084,.06],[145448,.08],[742958,.093],[891542,.103],[1485906,.113],[Infinity,.123]],
    addlMedicare: 250000,
  },
};
const SS_BASE = 184500, SDI = 0.013;

const bracketTax = (income, brackets) => {
  let tax = 0, prev = 0;
  for (const [cap, rate] of brackets) {
    if (income <= prev) break;
    tax += (Math.min(income, cap) - prev) * rate;
    prev = cap;
  }
  return tax;
};
console.assert(bracketTax(20000, [[10000,.1],[Infinity,.2]]) === 3000, 'bracketTax broken');

function calc(gross, s) {
  const t = T[s];
  const fed = bracketTax(Math.max(0, gross - t.fedStd), t.fed);
  const ss = Math.min(gross, SS_BASE) * 0.062;
  const medicare = gross * 0.0145 + Math.max(0, gross - t.addlMedicare) * 0.009;
  const caTaxable = Math.max(0, gross - t.caStd);
  const ca = Math.max(0, bracketTax(caTaxable, t.ca) - t.caCredit) + Math.max(0, caTaxable - 1e6) * 0.01; // +1% Mental Health Services tax
  const sdi = gross * SDI;
  const lines = [['Federal income tax', fed], ['Social Security', ss], ['Medicare', medicare], ['CA income tax', ca], ['CA SDI', sdi]];
  return { lines, net: gross - lines.reduce((a, [, v]) => a + v, 0) };
}

let fx = { huf: null, btc: null }; // per 1 USD
const usd = n => n.toLocaleString('en-US', { style:'currency', currency:'USD', maximumFractionDigits:0 });
const huf = n => fx.huf ? Math.round(n * fx.huf).toLocaleString('hu-HU') + ' Ft' : '…';
const btc = n => fx.btc ? '₿ ' + (n * fx.btc).toFixed(4) : '…';

function render() {
  const gross = +document.getElementById('salary').value.replace(/[^\d]/g, '') || 0; // ponytail: whole dollars only; "$180.000" and "180,000" both parse
  const { lines, net } = calc(gross, document.getElementById('status').value);
  const pct = v => gross ? (v / gross * 100).toFixed(1) + '%' : '';
  document.getElementById('breakdown').innerHTML =
    `<tr><th>Annual</th><th>USD</th><th>% of gross</th></tr>
     <tr><td>Gross salary</td><td>${usd(gross)}</td><td></td></tr>` +
    lines.map(([k, v]) => `<tr class="neg"><td>${k}</td><td>−${usd(v)}</td><td>${pct(v)}</td></tr>`).join('') +
    `<tr class="total"><td>Take-home</td><td>${usd(net)}</td><td>${pct(net)}</td></tr>`;
  const housing = +document.getElementById('housing').value.replace(/[^\d]/g, '') || 0;
  const table = (title, yearly, cls = '') =>
    `<tr><th>${title}</th><th>USD</th><th>HUF</th><th>BTC</th></tr>` +
    [['Per year', yearly], ['Per month', yearly / 12], ['Each paycheck (1st & 15th)', yearly / 24]]
      .map(([k, v]) => `<tr class="${cls}"><td>${k}</td><td>${usd(v)}</td><td>${huf(v)}</td><td>${btc(v)}</td></tr>`).join('');
  document.getElementById('pay').innerHTML = table('Take-home', net);
  document.getElementById('housingCard').hidden = !housing;
  document.getElementById('afterHousing').innerHTML =
    table('Housing', 12 * housing, 'neg') + table('Left after housing', net - 12 * housing);
}

fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,huf')
  .then(r => r.json())
  .then(({ bitcoin: b }) => {
    fx = { huf: b.huf / b.usd, btc: 1 / b.usd };
    document.getElementById('rates').textContent =
      `Rates (CoinGecko, live): 1 USD = ${fx.huf.toFixed(2)} HUF · 1 BTC = ${usd(b.usd)}`;
    render();
  })
  .catch(() => document.getElementById('rates').textContent = 'Could not load exchange rates (CoinGecko unreachable).');

document.getElementById('salary').addEventListener('input', render);
document.getElementById('housing').addEventListener('input', render);
document.getElementById('status').addEventListener('change', render);
render();
</script>
</body>
</html>
